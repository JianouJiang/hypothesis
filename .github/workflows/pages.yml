name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp experiment.html experiment.js experiments.js experiment.css lab-renderer.js live.html live.js live.css livestreams.js index.html bitcoin.html aerofoil.html galton.html escape.html competitions.html profile.html styles.css home.css aerofoil.css collision.css competitions.css profile.css app.js home.js aerofoil.js flow-renderer.js collision.js competitions.js profile.js guest.js catalog.js market.js favicon.svg deployment.json community-ui.js community.css inbox.html inbox.js _site/
          cp -r geometry _site/geometry
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
